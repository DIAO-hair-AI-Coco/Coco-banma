<style>
/* ============ 基础与变量 ============ */
:root{
  --bg:#eef3fa; --card:#ffffff; --ink:#17233b; --muted:#5c6b82; --line:#dfe7f2;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-l:#dbeafe;
  --accent:#f59e0b; --accent-l:#fef3c7;
  --intake:#0ea5e9; --comp:#d97706; --power:#ea580c; --exhaust:#64748b;
  --good:#16a34a; --good-l:#dcfce7; --bad:#dc2626; --bad-l:#fee2e2;
  --navy:#0b1b3a; --navy2:#123061;
  --r:16px; --shadow:0 10px 30px rgba(23,43,86,.08);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden}
img,svg{max-width:100%;vertical-align:middle}
button{font-family:inherit;cursor:pointer;border:none;background:none}
::selection{background:#bfdbfe}
/* 滚动条 */
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:#b9c8de;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶部进度条 ============ */
#progressBar{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,#38bdf8,#2563eb,#f59e0b);z-index:1000;transition:width .1s linear}

/* ============ Hero ============ */
.hero{position:relative;color:#fff;background:radial-gradient(1200px 600px at 70% -10%,#1d4ed8 0%,transparent 55%),linear-gradient(160deg,#0b1b3a 0%,#123061 55%,#0e2a5c 100%);overflow:hidden;padding:64px 20px 40px}
.hero .road{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#1b1f2c,#14161f)}
.hero .road::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:repeating-linear-gradient(90deg,#f8fafc 0 44px,transparent 44px 92px);opacity:.85;animation:roadMove 1.2s linear infinite}
.hero .road::after{content:"";position:absolute;left:0;right:0;top:64px;height:2px;background:repeating-linear-gradient(90deg,#94a3b8 0 40px,transparent 40px 84px);opacity:.5;animation:roadMove 2.4s linear infinite}
@keyframes roadMove{to{transform:translateX(-92px)}}
.car{position:absolute;bottom:18px;left:8%;width:min(300px,34vw);z-index:3;animation:carBounce 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
@keyframes carBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.car2{position:absolute;bottom:18px;right:-140px;width:min(220px,26vw);opacity:.55;z-index:2;animation:carDrive 9s linear infinite}
@keyframes carDrive{from{transform:translateX(0)}to{transform:translateX(-160vw)}}
.hero-inner{position:relative;z-index:5;max-width:980px;margin:0 auto;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:1px;margin-bottom:18px}
.hero h1{font-size:clamp(26px,5vw,46px);font-weight:800;line-height:1.25;letter-spacing:.5px}
.hero h1 .teacher{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.55);padding:4px 14px;border-radius:999px;vertical-align:middle;margin-left:12px;letter-spacing:1px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
@media(max-width:560px){.hero h1 .teacher{display:block;width:max-content;margin:10px auto 0;font-size:12.5px}}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7dd3fc,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:12px;font-size:clamp(14px,2.4vw,19px);color:#bcd0ef;font-weight:500}
.hero .meta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:13px;color:#9db8e6}
.hero .meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:999px}
.heartline{position:relative;z-index:5;max-width:430px;margin:26px auto 0;display:flex;align-items:center;gap:10px;justify-content:center}
.heartline .beat{font-size:30px;animation:heartBeat 1s ease-in-out infinite;display:inline-block}
@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.28)}28%{transform:scale(1)}42%{transform:scale(1.22)}70%{transform:scale(1)}}
.hero .scrollHint{margin-top:26px;font-size:12.5px;color:#7f9bd0;letter-spacing:2px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ============ 导航 ============ */
nav.tabs{position:fixed;top:0;left:0;right:0;z-index:900;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(23,43,86,.06)}
nav.tabs .inner{max-width:1100px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
nav.tabs .inner::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:10px;white-space:nowrap;transition:.2s}
nav.tabs a:hover{background:var(--primary-l);color:var(--primary-d)}
nav.tabs a.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
nav.tabs a .num{font-size:10.5px;opacity:.75;margin-right:4px;font-weight:700}

/* ============ 章节通用 ============ */
/* ============ 左右翻页布局 ============ */
.pages{position:relative;width:100vw;height:100vh;overflow:hidden}
.course-track{display:flex;flex-direction:row;width:100vw;height:100vh;transition:transform .55s cubic-bezier(.5,0,.2,1);will-change:transform}
.page{flex:0 0 100vw;height:100vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-margin-top:0}
.page-inner{max-width:1100px;margin:0 auto;padding:76px 16px 110px}
#sec-intro .page-inner{padding-top:24px}
.page > .hero{margin:0;padding:80px 20px 30px}
/* ============ 系列课程：首页 & 视图 ============ */
.view{display:none}
.view.active{display:block}
#homeView{min-height:100vh;overflow-y:auto;background:radial-gradient(1000px 520px at 72% -8%,#1d4ed8 0%,transparent 58%),linear-gradient(160deg,#0b1b3a 0%,#123061 58%,#0e2a5c 100%);color:#fff}
.home-inner{max-width:1020px;margin:0 auto;padding:72px 20px 70px}
.home-title{font-size:clamp(24px,4.4vw,40px);font-weight:800;text-align:center;letter-spacing:.5px}
.home-title em{font-style:normal;background:linear-gradient(90deg,#7dd3fc,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.home-sub{text-align:center;color:#bcd0ef;margin-top:12px;font-size:15px}
.home-sec{font-size:13.5px;font-weight:800;color:#9db8e6;letter-spacing:2px;margin:34px 0 12px}
.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.course-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:22px;cursor:pointer;transition:.25s;backdrop-filter:blur(8px);text-align:left;color:#fff;position:relative;overflow:hidden}
.course-card:hover{transform:translateY(-6px);background:rgba(255,255,255,.15);box-shadow:0 18px 38px rgba(0,0,0,.34)}
.course-card .ci{font-size:34px}
.course-card .ct{font-size:19px;font-weight:800;margin-top:10px;line-height:1.4}
.course-card .ce{font-size:12.5px;color:#9db8e6;margin-top:5px}
.course-card .cd{font-size:13.5px;color:#bcd0ef;margin-top:10px;line-height:1.75}
.course-card .cb{margin-top:16px;display:inline-block;font-size:13px;font-weight:700;background:var(--primary);padding:8px 18px;border-radius:999px}
.course-card .cnum{position:absolute;right:16px;top:14px;font-size:12px;font-weight:800;color:#7f9bd0;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:999px}
.course-card.game{background:linear-gradient(140deg,rgba(251,191,36,.2),rgba(239,68,68,.14));border-color:rgba(251,191,36,.42)}
.course-card.game .cb{background:var(--accent);color:#3b2506}
.home-back{position:fixed;top:12px;left:14px;z-index:970;display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--primary-d);cursor:pointer;box-shadow:var(--shadow)}
.home-back:hover{background:var(--primary-l)}
.home-back.show{display:inline-flex}
.home-stats{text-align:center;color:#7f9bd0;font-size:12.5px;margin-top:26px}
@media(max-width:900px){.home-inner{padding:58px 16px 60px}.home-back{top:auto;bottom:68px;left:50%;transform:translateX(-50%)}}
/* 翻页控件 */
.page-nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:950;display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.85);color:#e2e8f0;padding:8px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.page-nav button{width:34px;height:34px;border-radius:50%;background:#1d4ed8;color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:.2s}
.page-nav button:hover{background:#2563eb}
.page-nav button:disabled{opacity:.35;cursor:default}
.page-nav .cnt{font-size:13px;font-weight:700;min-width:46px;text-align:center}
.page-nav .dots{display:flex;gap:5px}
.page-nav .dots i{width:7px;height:7px;border-radius:50%;background:#475569;transition:.2s}
.page-nav .dots i.on{background:#fbbf24;transform:scale(1.3)}
.side-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:940;width:46px;height:46px;border-radius:50%;background:rgba(15,23,42,.55);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.2s;backdrop-filter:blur(4px)}
.side-arrow:hover{background:rgba(37,99,235,.85)}
.side-arrow:disabled{opacity:0;pointer-events:none}
#arrowPrev{left:10px}#arrowNext{right:10px}
@media(max-width:900px){.side-arrow{display:none}}
/* 抽人卡片 */
.pick-card{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(120deg,#fff7ed,#fffbeb);border:1.5px solid #fdba74;border-radius:14px;padding:12px 16px;margin-bottom:16px}
.pick-card .p-label{font-weight:800;color:#9a3412;font-size:14px;white-space:nowrap}
.pick-stage{flex:1;min-width:130px;text-align:center}
.pick-stage .nm{font-size:22px;font-weight:900;color:#ea580c;letter-spacing:1px;min-height:30px;display:inline-block}
.pick-stage .nm.rolling{animation:pickPulse .12s linear infinite}
@keyframes pickPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}}
.pick-note{font-size:12px;color:#b45309;width:100%;text-align:center}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.sec-num{flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--primary),#3b82f6);box-shadow:0 8px 18px rgba(37,99,235,.35)}
.sec-head h2{font-size:clamp(19px,3.4vw,26px);font-weight:800;line-height:1.3}
.sec-head h2 small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.card h3{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .en{font-weight:600;color:var(--primary);font-size:13.5px;background:var(--primary-l);padding:2px 10px;border-radius:999px}
.tip{display:flex;gap:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#92400e;margin-top:12px}
.tip b{color:#b45309}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;font-weight:700;font-size:14.5px;padding:11px 22px;border-radius:12px;transition:.2s;box-shadow:0 6px 14px rgba(37,99,235,.3)}
.btn:hover{background:var(--primary-d);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--primary-d);border:1.5px solid var(--primary);box-shadow:none}
.btn.ghost:hover{background:var(--primary-l)}
.btn.act{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 6px 14px rgba(37,99,235,.3)}
.btn.warn{background:var(--power)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ============ 导入章节 ============ */
.intro-qa{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}
.qa-card{background:linear-gradient(160deg,#eff6ff,#ffffff);border:1px solid #bfdbfe;border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.qa-card::before{content:"❓";position:absolute;right:-14px;top:-16px;font-size:80px;opacity:.1;transform:rotate(-12deg)}
.qa-card.ans::before{content:"💡"}
.qa-card h4{font-size:15.5px;margin-bottom:8px;color:var(--primary-d)}
.qa-card p{font-size:14.5px;color:var(--ink)}
.keyline{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.keyline span{background:var(--accent-l);border:1px solid #fcd34d;color:#92400e;font-size:13px;padding:5px 12px;border-radius:999px;font-weight:600}
.typed{min-height:60px;font-size:15px;color:var(--muted);background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px 16px;margin-top:10px}
.typed .caret{display:inline-block;width:2px;height:1.05em;background:var(--primary);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}

/* ============ 单词表 ============ */
.tab-switch{display:inline-flex;background:#e2e8f0;border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.tab-switch button{font-size:13.5px;font-weight:700;padding:8px 18px;border-radius:9px;color:var(--muted);transition:.2s}
.tab-switch button.on{background:#fff;color:var(--primary-d);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.vocab-table{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
.vocab-table th{background:#f1f5fb;color:var(--primary-d);text-align:left;padding:11px 14px;font-size:13px;letter-spacing:.5px;border-bottom:2px solid var(--line)}
.vocab-table td{padding:11px 14px;border-bottom:1px solid #eef2f8;vertical-align:middle}
.vocab-table tr{transition:.15s}
.vocab-table tr:hover{background:#f5f9ff}
.vocab-table .en{font-weight:700;font-size:15px}
.vocab-table .ipa{color:var(--muted);font-size:13.5px;font-family:Georgia,"Times New Roman",serif}
.vocab-table .zh{font-weight:700;color:#0f766e}
.speak-btn{width:34px;height:34px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.speak-btn:hover{background:var(--primary);color:#fff;transform:scale(1.08)}
.speak-btn.speaking{background:var(--accent);color:#fff;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* 闪卡 */
.flash-stage{display:none}
.flash-stage.on{display:block}
.flash-card{width:min(440px,92%);margin:0 auto;perspective:1100px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:230px;transform-style:preserve-3d;transition:transform .55s}
.flash-card.flip .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.flash-face.front{background:linear-gradient(150deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 14px 30px rgba(37,99,235,.4)}
.flash-face.front .big{font-size:34px;font-weight:800;letter-spacing:.5px}
.flash-face.front .ipa{color:#bfdbfe;font-size:15px}
.flash-face.back{background:#fff;border:2px solid var(--primary);transform:rotateY(180deg);box-shadow:0 14px 30px rgba(23,43,86,.15)}
.flash-face.back .zh{font-size:34px;font-weight:800;color:var(--primary-d)}
.flash-face.back .en{color:var(--muted);font-size:15px}
.flash-nav{display:flex;justify-content:center;gap:12px;margin-top:16px;align-items:center;flex-wrap:wrap}
.flash-nav .cnt{font-size:13.5px;color:var(--muted);min-width:70px;text-align:center;font-weight:700}

/* ============ 课文阅读 ============ */
.reading{border-left:4px solid var(--primary);background:linear-gradient(180deg,#fff,#f8fbff)}
.reading .en-text{font-size:15.5px;color:var(--ink);font-weight:500;line-height:1.9}
.reading .zh-text{margin-top:10px;font-size:14.5px;color:#0f766e;background:#f0fdfa;border-radius:10px;padding:12px 14px;border:1px solid #99f6e4}
.reading .hl{background:#fef08a;border-radius:4px;padding:0 3px;font-weight:700;color:#854d0e}
.tgl-btn{margin-top:12px;font-size:12.5px;color:var(--primary-d);background:var(--primary-l);padding:6px 14px;border-radius:999px;font-weight:700}
.tgl-btn:hover{background:#bfdbfe}

/* ============ 爆炸图 ============ */
.stage{position:relative;background:linear-gradient(180deg,#0d1b36,#16264d);border-radius:var(--r);overflow:hidden;border:1px solid #24365f}
.stage-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid #24365f}
.stage-tools .t{color:#9db8e6;font-size:13px;margin-right:auto}
#explodeSvg{width:100%;height:auto;display:block}
.part-label{font-size:11.5px;fill:#e2e8f0;font-weight:600;pointer-events:none}
.part-label .zh{fill:#7dd3fc;font-size:10.5px}
.badge-circle{fill:#f59e0b;stroke:#fff;stroke-width:1.5;cursor:pointer}
.badge-text{fill:#fff;font-size:11px;font-weight:800;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.part-sel .badge-circle{fill:#f43f5e}
.info-panel{background:#0f2147;border:1px solid #2a3f6e;color:#dbe7ff;border-radius:14px;margin:14px 16px;padding:14px 18px;display:flex;gap:14px;align-items:center;min-height:56px}
.info-panel .n{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:#f59e0b;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.info-panel .e{font-weight:800;font-size:16.5px;color:#fff}
.info-panel .z{color:#7dd3fc;font-weight:700;font-size:14.5px}
.info-panel .d{color:#93a9d8;font-size:13px;margin-top:2px}
.stage-note{color:#64748b;font-size:13px;padding:10px 16px 14px}

/* ============ 发动机系统 ============ */
.sys-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sys-chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;transition:.25s;position:relative}
.sys-chip .ico{font-size:26px;margin-bottom:6px;display:block}
.sys-chip .nm{font-weight:800;font-size:14px}
.sys-chip .en2{font-size:11px;color:var(--muted);margin-top:2px}
.sys-chip.on{border-color:var(--good);background:var(--good-l);transform:translateY(-3px);box-shadow:0 8px 16px rgba(22,163,74,.2)}
.sys-chip.on .nm{color:var(--good)}
.sys-chip.off{border-color:#e2e8f0;background:#f8fafc;opacity:.55;filter:grayscale(.6)}
.engine-box{background:linear-gradient(180deg,#111c33,#0c1526);border-radius:14px;padding:20px;margin-top:14px;position:relative;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfe0ff}
#sysEngineSvg{width:min(460px,94%);height:auto}
.engine-box.running #sysEngineSvg{animation:engineShake .08s linear infinite}
@keyframes engineShake{0%,100%{transform:translate(0,0)}25%{transform:translate(.6px,-.8px)}75%{transform:translate(-.6px,.7px)}}
.rpm{font-size:13px;color:#7dd3fc;font-weight:700;letter-spacing:1px;margin-top:8px}
.msgline{text-align:center;font-size:14.5px;min-height:24px;font-weight:700;color:var(--primary-d);margin-top:10px}

/* ============ 气缸排列 ============ */
.arr-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.arr-tab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;color:var(--muted);transition:.2s}
.arr-tab.on{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.3)}
#cylSvg{width:100%;height:auto;background:#fff;border-radius:12px;border:1px solid var(--line)}
.cyl-info{margin-top:14px;padding:16px 18px;border-radius:12px;font-size:14.5px;background:#f8fafc;border:1px solid var(--line)}
.cyl-info b{color:var(--primary-d)}
.piston-cyl{cursor:pointer}
.piston-cyl:hover .piston-body{fill:#fbbf24}
.cyl-hl .cyl-wall{stroke:#f59e0b;stroke-width:4}
.crank-rot{font-size:12px;color:var(--muted);margin-top:6px;font-weight:700}

/* ============ 四冲程动画 ============ */
.four-wrap{background:linear-gradient(180deg,#0d1b36,#10224a);border-radius:var(--r);border:1px solid #24365f;overflow:hidden}
.four-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid #24365f}
.four-phase{display:flex;gap:8px;flex-wrap:wrap}
.phase-btn{font-size:13px;font-weight:800;padding:8px 14px;border-radius:10px;color:#9db8e6;border:1.5px solid #2c3f6e;transition:.2s;background:transparent}
.phase-btn.on{color:#fff;border-color:transparent}
.phase-btn[data-p="1"].on{background:var(--intake)}
.phase-btn[data-p="2"].on{background:var(--comp)}
.phase-btn[data-p="3"].on{background:var(--power)}
.phase-btn[data-p="4"].on{background:var(--exhaust)}
.four-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl{width:42px;height:42px;border-radius:12px;background:#1b2e5c;color:#cfe0ff;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.2s;border:1px solid #2c3f6e}
.ctrl:hover{background:#2563eb;color:#fff}
.ctrl.big{width:52px;height:52px;font-size:20px;background:var(--primary);color:#fff}
.speed-slider{display:flex;align-items:center;gap:8px;color:#9db8e6;font-size:12.5px}
.speed-slider input{width:90px;accent-color:#38bdf8}
#fourSvg{width:100%;height:auto;display:block;background:linear-gradient(180deg,#0e1d3d,#0c1730)}
.four-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #24365f}
.leg-item{padding:12px 10px;text-align:center;border-right:1px solid #24365f;cursor:pointer;transition:.2s}
.leg-item:last-child{border-right:none}
.leg-item.on{background:rgba(255,255,255,.07)}
.leg-item .t{font-size:14px;font-weight:800}
.leg-item .s{font-size:10.5px;color:#8fa6d4;margin-top:1px}
.leg-item[data-p="1"] .t{color:#38bdf8}
.leg-item[data-p="2"] .t{color:#fbbf24}
.leg-item[data-p="3"] .t{color:#fb923c}
.leg-item[data-p="4"] .t{color:#94a3b8}
.narration{color:#dbe7ff;font-size:14.5px;padding:14px 18px;min-height:74px;border-top:1px solid #24365f;display:flex;gap:12px;align-items:flex-start}
.narration .ntag{flex:0 0 auto;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-top:3px}
.ntag.n1{background:var(--intake)}.ntag.n2{background:var(--comp)}.ntag.n3{background:var(--power)}.ntag.n4{background:var(--exhaust)}

/* ============ 练习 ============ */
.quiz-shell{max-width:760px;margin:0 auto}
.q-progress{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-bottom:20px}
.q-progress i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb);border-radius:99px;transition:width .4s}
.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:26px;position:relative}
.q-type{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--primary);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.q-type.tf{background:#7c3aed}
.q-text{font-size:17.5px;font-weight:700;line-height:1.6;margin-bottom:18px}
.q-text .en2{color:var(--primary);font-size:15px;font-weight:700}
.q-opts{display:grid;gap:10px}
.q-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 16px;font-size:15px;font-weight:600;transition:.18s;background:#fff}
.q-opt:hover:not(:disabled){border-color:var(--primary);background:#eff6ff}
.q-opt .k{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:#eef2f8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.q-opt.correct{border-color:var(--good);background:var(--good-l)}
.q-opt.correct .k{background:var(--good);color:#fff}
.q-opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.q-opt.wrong .k{background:var(--bad);color:#fff}
.q-opt:disabled{cursor:default;opacity:.85}
.q-feedback{margin-top:14px;border-radius:12px;padding:13px 16px;font-size:14px;display:none}
.q-feedback.show{display:block}
.q-feedback.ok{background:var(--good-l);border:1px solid #86efac;color:#14532d}
.q-feedback.no{background:var(--bad-l);border:1px solid #fca5a5;color:#7f1d1d}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.q-score{font-size:14px;font-weight:800;color:var(--muted)}
.q-score b{color:var(--primary-d);font-size:17px}
.q-result{text-align:center;padding:30px 10px}
.q-result .emo{font-size:52px}
.q-result .big{font-size:22px;font-weight:800;margin:10px 0 4px}
.q-result .sub{color:var(--muted);font-size:14.5px;margin-bottom:18px}

/* ============ 思维导图 ============ */
.mind-wrap{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.mind-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#fff,#f8faff)}
.mind-scroll::after{content:"在手机上可左右滑动查看完整知识树 ⇆";display:block;text-align:center;font-size:12px;color:#94a3b8;padding:6px 0 10px}
#mindSvg{width:100%;min-width:720px;height:auto;display:block}
.mind-detail{position:sticky;top:80px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-height:220px}
.mind-detail .dt{font-size:17px;font-weight:800;color:var(--primary-d);margin-bottom:6px}
.mind-detail .de{font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
.mind-detail .dd{font-size:14px;color:var(--ink)}
.mind-detail .hint{color:#94a3b8;font-size:13px}

/* ============ 页脚 ============ */
footer{background:var(--navy);color:#8fa6d4;text-align:center;padding:26px 16px;font-size:13px}
footer b{color:#cfe0ff}

/* ============ 弹层 ============ */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#17233b;color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:1200;transition:.35s;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;max-width:86vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .grid2,.intro-qa,.mind-wrap{grid-template-columns:1fr}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .sys-grid{grid-template-columns:repeat(3,1fr)}
  .four-legend{grid-template-columns:repeat(2,1fr)}
  .leg-item{border-bottom:1px solid #24365f}
  .mind-detail{position:static}
  .hero{padding-top:48px}
}
@media(max-width:560px){
  main{padding:18px 12px 70px}
  .grid3{grid-template-columns:1fr}
  .sys-grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:16px}
  .sec-num{width:40px;height:40px;font-size:17px}
  .four-controls{width:100%;justify-content:center}
  .hero .car{width:min(230px,40vw)}
}
/* ============ 课程二：活塞与连杆总成 ============ */
.lesson-hero{position:relative;color:#fff;background:radial-gradient(900px 480px at 70% -10%,#0e7490 0%,transparent 58%),linear-gradient(160deg,#0b1b3a,#123061 60%,#0f3a52);padding:80px 20px 34px;text-align:center;overflow:hidden}
.lesson-hero h1{font-size:clamp(24px,4.6vw,42px);font-weight:800;line-height:1.3}
.lesson-hero h1 em{font-style:normal;background:linear-gradient(90deg,#7dd3fc,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson-hero .sub{margin-top:12px;color:#bcd0ef;font-size:clamp(14px,2.2vw,18px)}
.lesson-hero .meta{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#9db8e6}
.lesson-hero .meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:999px}
.lesson-hero .badge{display:inline-flex;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:7px 16px;border-radius:999px;font-size:13px;letter-spacing:1px;margin-bottom:16px}
.lesson-hero .teacher{font-size:13px;font-weight:700;background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.55);padding:4px 14px;border-radius:999px;vertical-align:middle;margin-left:12px;white-space:nowrap}
.parts-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.parts-hint{font-size:12.5px;color:var(--muted)}
#pistonSvg{width:100%;height:auto;background:linear-gradient(180deg,#0d1b36,#16264d);border-radius:14px;display:block}
#pistonSvg .part{cursor:pointer;transition:transform .55s cubic-bezier(.5,0,.2,1)}
#pistonSvg .part:hover .shp{filter:drop-shadow(0 0 6px rgba(56,189,248,.9))}
#pistonSvg .part.sel .shp{filter:drop-shadow(0 0 8px rgba(251,191,36,.95))}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-item{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.18s;text-align:left;color:var(--ink)}
.match-item:hover{border-color:var(--primary);background:var(--primary-l)}
.match-item.sel{border-color:var(--accent);background:var(--accent-l)}
.match-item.done{border-color:var(--good);background:var(--good-l);color:#14532d;cursor:default;opacity:.88}
.match-item.wrong{border-color:var(--bad);background:var(--bad-l);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.blank-line{font-size:15px;line-height:2.4;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
[data-theme="dark"] .blank-line{background:#121c31}
.blank-line input{width:130px;padding:4px 8px;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-align:center;font-family:var(--font)}
.blank-line input.ok{border-color:var(--good);background:var(--good-l)}
.blank-line input.no{border-color:var(--bad);background:var(--bad-l)}
.tree{margin-top:6px}
.tree-root{display:inline-block;background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;font-size:16px}
.tree-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px;padding-left:10px;border-left:3px solid var(--primary-l)}
.tree-node{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
[data-theme="dark"] .tree-node{background:#121c31}
.tree-node b{display:block;font-size:15.5px;color:var(--primary-d);margin-bottom:8px}
.tree-node ul{margin:0;padding-left:18px;font-size:14px;line-height:2}
.tree-node .tz{color:var(--muted);font-size:12.5px;margin-left:6px}
@media(max-width:700px){.match-wrap{grid-template-columns:1fr}}

/* ============ 单词大作战 游戏 ============ */.game-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.diff-group{display:flex;gap:8px;flex-wrap:wrap}
.diff-btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:800;font-size:13px;color:var(--muted);transition:.2s}
.diff-btn.on{border-color:var(--primary);background:var(--primary);color:#fff}
.diff-btn[data-diff="easy"].on{background:var(--good);border-color:var(--good)}
.diff-btn[data-diff="normal"].on{background:var(--accent);border-color:var(--accent)}
.diff-btn[data-diff="hard"].on{background:var(--bad);border-color:var(--bad)}
.game-box{position:relative;background:linear-gradient(180deg,#9bd98b,#7cc96b);border-radius:14px;overflow:hidden}
#gameCanvas{width:100%;height:auto;display:block}
.game-plants{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px;background:rgba(0,0,0,.55)}
.plant-card{border:2px solid #fff;background:linear-gradient(180deg,#d9f99d,#86efac);color:#14532d;font-weight:800;font-size:15px;padding:8px 16px;border-radius:12px;cursor:pointer;transition:.15s;min-width:80px}
.plant-card:hover{transform:translateY(-3px);box-shadow:0 6px 12px rgba(0,0,0,.25)}
.plant-card:active{transform:scale(.95)}
.plant-card.bad{background:#fecaca;color:#7f1d1d;border-color:#ef4444}
.game-overlay{position:absolute;inset:0;background:rgba(5,5,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10}
.dead-char{font-size:clamp(80px,20vw,150px);font-weight:900;color:#dc2626;text-shadow:0 0 30px rgba(220,38,38,.8),0 4px 8px rgba(0,0,0,.6);animation:deadIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes deadIn{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
.dead-sub{font-size:18px;color:#fca5a5;font-weight:800;letter-spacing:4px}
.win-char{font-size:90px;animation:deadIn .5s cubic-bezier(.2,1.4,.4,1)}
.win-sub{font-size:20px;color:#fbbf24;font-weight:800}
@media(max-width:560px){.plant-card{font-size:13px;padding:6px 12px;min-width:60px}}

/* ============ A/B 视觉·动效升级 ============ */
/* 主题切换按钮 */
.theme-btn{position:fixed;top:52px;right:14px;z-index:960;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s}
.theme-btn:hover{transform:rotate(18deg) scale(1.1)}
/* 渐变背景光斑 */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none}
body::before{width:440px;height:440px;background:radial-gradient(circle,#38bdf8 0%,transparent 70%);top:-140px;left:-140px}
body::after{width:480px;height:480px;background:radial-gradient(circle,#fbbf24 0%,transparent 70%);bottom:-160px;right:-160px}
/* 玻璃拟态 */
.card{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(255,255,255,.8)}
nav.tabs{background:rgba(255,255,255,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
/* 深色主题 */
[data-theme="dark"]{
  --bg:#0a111f; --card:#121c31; --ink:#e5ecf9; --muted:#94a7cc; --line:#25324e;
  --primary:#3b82f6; --primary-d:#60a5fa; --primary-l:#1c2c4e;
  --accent:#fbbf24; --accent-l:#3a2f14;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
[data-theme="dark"] body{background:var(--bg)}
[data-theme="dark"] .card{background:rgba(18,28,49,.85)}
[data-theme="dark"] nav.tabs{background:rgba(10,17,31,.7);border-bottom-color:#25324e}
[data-theme="dark"] nav.tabs a{color:var(--muted)}
[data-theme="dark"] nav.tabs a.active{background:var(--primary);color:#fff}
[data-theme="dark"] .qa-card{background:linear-gradient(160deg,#12213f,#121c31);border-color:#25324e}
[data-theme="dark"] .reading{background:linear-gradient(180deg,#121c31,#101a2d);border-left-color:var(--primary)}
[data-theme="dark"] .reading .zh-text{background:#0c2f2b;border-color:#14524c;color:#7fe0d0}
[data-theme="dark"] .tip{background:#2b2410;border-color:#6b5416;color:#fcd34d}
[data-theme="dark"] .q-card{background:var(--card)}
[data-theme="dark"] .q-opt{background:#18233b;border-color:#2a3a5c;color:var(--ink)}
[data-theme="dark"] .q-opt:hover:not(:disabled){background:#1e2c48}
[data-theme="dark"] .vocab-table{background:#121c31}
[data-theme="dark"] .vocab-table th{background:#18233b;color:#9ec1ff}
[data-theme="dark"] .vocab-table td{border-color:#1f2b44}
[data-theme="dark"] .vocab-table tr:hover{background:#1a2742}
[data-theme="dark"] .flash-face.back{background:#121c31;border-color:var(--primary)}
[data-theme="dark"] .tab-switch{background:#1a2742}
[data-theme="dark"] .tab-switch button.on{background:#2b3b5e;color:#dbe7ff}
[data-theme="dark"] .arr-tab{background:#18233b;color:var(--muted);border-color:#2a3a5c}
[data-theme="dark"] .mind-detail{background:#121c31}
[data-theme="dark"] .mind-scroll{background:linear-gradient(180deg,#121c31,#0f1830)}
[data-theme="dark"] .cyl-info{background:#121c31}
[data-theme="dark"] .diff-btn{background:#18233b;color:var(--muted);border-color:#2a3a5c}
[data-theme="dark"] .pick-card{background:linear-gradient(120deg,#2b1d0a,#2b2410);border-color:#6b5416}
[data-theme="dark"] .pick-note{color:#fcd34d}
[data-theme="dark"] .q-feedback.ok{background:#0c2f1c;border-color:#14532d;color:#86efac}
[data-theme="dark"] .q-feedback.no{background:#3a1414;border-color:#7f1d1d;color:#fca5a5}
[data-theme="dark"] .stage-note{color:#94a7cc}
[data-theme="dark"] .mind-detail .dt{color:#60a5fa}
[data-theme="dark"] #mindSvg{background:#121c31}
[data-theme="dark"] .hero .meta span{background:rgba(255,255,255,.08)}
/* 滚动渐显 */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
/* 翻页入场动画 */
.page-enter{animation:pageEnter .5s cubic-bezier(.22,1,.36,1)}
@keyframes pageEnter{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
/* 微交互 */
.btn:active{transform:scale(.96)}
.card{transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 16px 40px rgba(23,43,86,.14)}
[data-theme="dark"] .card:hover{box-shadow:0 16px 40px rgba(0,0,0,.5)}
@media(max-width:900px){.theme-btn{top:auto;bottom:68px}}
@media(prefers-reduced-motion:reduce){.reveal,.page-enter{transition:none;animation:none;opacity:1;transform:none}}
/* 拼写题 */
.q-type.spell{background:#0d9488}
.q-spell{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-spell input{flex:1;min-width:180px;padding:12px 16px;font-size:16px;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none;transition:.2s;font-family:var(--font)}
.q-spell input:focus{border-color:var(--primary)}
.spell-hint{margin-top:10px;font-size:13px;color:var(--muted);font-weight:600}
/* 视频界面 */
.vocab-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}

<script>
/* ================================================================
   PART 1 · 数据层与通用交互
================================================================ */
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent=null){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs){ if(k==='text') e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(parent) parent.appendChild(e);
  return e;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------- 单词发音（在线真人发音优先，系统语音兜底） ---------- */
let voices=[];
if('speechSynthesis'in window){
  const lv=()=>{voices=speechSynthesis.getVoices();};
  lv(); speechSynthesis.onvoiceschanged=lv;
}
/* 同一时间只允许一个发音，播放新词自动停旧词 */
let _curAudio=null, _speakingBtn=null;
function _stopAudio(){
  if(_curAudio){ try{_curAudio.pause();}catch(e){} _curAudio=null; }
  if(_speakingBtn){ _speakingBtn.classList.remove('speaking'); _speakingBtn=null; }
}
/* 单词音频文件名映射（本地高清音频，edge-tts 生成） */
const AUDIO_MAP={engine:'engine',automobile:'automobile',component:'component',system:'system',fuel:'fuel',cylinder:'cylinder',piston:'piston',stroke:'stroke',position:'position',bottom:'bottom',ignition:'ignition',lubrication:'lubrication','intake stroke':'intake-stroke',compression:'compression','power stroke':'power-stroke','exhaust stroke':'exhaust-stroke','inlet valve':'inlet-valve','exhaust valve':'exhaust-valve','V-type':'v-type',horizontally:'horizontally',operate:'operate',continuously:'continuously'};
/* 本地高清发音（edge-tts 美音）→ 失败自动回退有道 → 再失败回退系统语音 */
function playLocal(text,btn){
  const slug=AUDIO_MAP[text];
  if(!slug)return false;
  const a=new Audio('audio/'+slug+'.mp3');
  _curAudio=a; _speakingBtn=btn;
  if(btn)btn.classList.add('speaking');
  a.onerror=()=>{ _stopAudio(); playYoudao(text,btn); };
  a.onended=()=>{ _stopAudio(); };
  a.play().catch(()=>{ _stopAudio(); playYoudao(text,btn); });
  return true;
}
/* 在线发音：有道词典真人发音（标准美音），桌面/手机通用、不受 iOS 静音键影响 */
function playYoudao(text,btn){
  _stopAudio();
  const a=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2');
  _curAudio=a; _speakingBtn=btn;
  if(btn)btn.classList.add('speaking');
  a.onerror=()=>{ _stopAudio(); toast('发音失败，已改用系统语音'); ttsSpeak(text,btn); };
  a.onended=()=>{ _stopAudio(); };
  a.play().catch(()=>{ _stopAudio(); ttsSpeak(text,btn); });
}
/* 系统语音合成（备用方案） */
function ttsSpeak(text,btn){
  if(!('speechSynthesis'in window)){ toast('当前设备不支持发音'); _stopAudio(); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9;
    const v=voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));
    if(v)u.voice=v;
    u.onend=()=>_stopAudio();
    u.onerror=()=>{ _stopAudio(); toast('发音失败：请检查系统英文语音设置（手机请确认未开静音）'); };
    _speakingBtn=btn; if(btn)btn.classList.add('speaking');
    speechSynthesis.speak(u);
  }catch(e){ _stopAudio(); }
}
function speak(text,lang,btn){
  if(!playLocal(text,btn)){ playYoudao(text,btn); }
}
function bindSpeak(btn,text,lang){
  btn.dataset.t=text; btn.dataset.l=lang||'en-US';
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    speak(btn.dataset.t,btn.dataset.l,btn);
  });
}

/* ---------- 主题切换（深色/浅色） ---------- */
(function(){
  const btn=$('#themeBtn');
  let saved=null;
  try{ saved=localStorage.getItem('dse-theme'); }catch(e){}
  const sys=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  let theme=saved||sys;
  function apply(t){
    theme=t;
    document.documentElement.setAttribute('data-theme', t);
    if(btn)btn.textContent=t==='dark'?'☀️':'🌙';
    try{ localStorage.setItem('dse-theme', t); }catch(e){}
  }
  apply(theme);
  if(btn)btn.addEventListener('click',()=>apply(theme==='dark'?'light':'dark'));
})();

/* ---------- 视频全屏 ---------- */
(function(){
  const btn=$('#btnFullscreen');
  if(!btn)return;
  btn.addEventListener('click',()=>{
    const f=document.querySelector('.video-frame iframe, .video-frame video');
    if(!f)return;
    if(document.fullscreenElement){
      if(document.exitFullscreen)document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }else{
      if(f.requestFullscreen)f.requestFullscreen().catch(()=>{});
      else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen();
    }
  });
})();

/* ---------- 滚动渐显（页内内容） ---------- */
function initReveal(){
  const els=document.querySelectorAll('.page-inner > *');
  els.forEach(el=>el.classList.add('reveal'));
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.05});
  els.forEach(el=>io.observe(el));
}


/* ================= 系列课程：元数据 + 按需加载 + 路由 + 翻页 ================= */
const COURSES=[
  { id:'engine', icon:'🔧', name:'发动机基本概念与运行原理',
    en:'Engine · Basic Concepts & Operating Principles',
    desc:'从"汽车的心脏"讲起：22 个专业单词、16 个零部件爆炸图、五大系统、气缸排列、四冲程原理动画。',
    file:'courses/engine.js', html:'courses/engine.html',
    pages:['sec-intro','sec-vocab','sec-reading','sec-explode','sec-systems','sec-cylinders','sec-four','sec-quiz','sec-mindmap'],
    tabs:['导入','单词短语','课文阅读','爆炸图','发动机系统','气缸排列','四冲程动画','闯关练习','知识总结'],
    bank:[{en:'engine',zh:'发动机'},{en:'automobile',zh:'汽车'},{en:'component',zh:'零部件'},{en:'system',zh:'系统'},{en:'fuel',zh:'燃料'},{en:'cylinder',zh:'气缸'},{en:'piston',zh:'活塞'},{en:'stroke',zh:'冲程'},{en:'position',zh:'位置'},{en:'bottom',zh:'末端'},{en:'ignition',zh:'点火'},{en:'lubrication',zh:'润滑'},{en:'intake stroke',zh:'进气冲程'},{en:'compression',zh:'压缩'},{en:'power stroke',zh:'做功冲程'},{en:'exhaust stroke',zh:'排气冲程'},{en:'inlet valve',zh:'进气门'},{en:'exhaust valve',zh:'排气门'},{en:'V-type',zh:'V型'},{en:'horizontally',zh:'水平地'},{en:'operate',zh:'运转'},{en:'continuously',zh:'连续不断地'}] },
  { id:'piston', icon:'⚙️', name:'活塞与连杆总成',
    en:'UNIT-3 · Piston and Rod Assembly',
    desc:'发动机最核心的机械构件：12 个专业单词、活塞组件零件爆炸图、3D 活塞连杆机构、喷油器式动画、25 题闯关。',
    file:'courses/piston.js', html:'courses/piston.html',
    pages:['sec2-intro','sec2-vocab','sec2-parts','sec2-text','sec2-quiz','sec2-summary'],
    tabs:['导入','单词短语','零件动画','课文阅读','闯关练习','知识总结'],
    bank:[{en:'cylindrical',zh:'圆筒状的'},{en:'hollow',zh:'中空的'},{en:'piston ring',zh:'活塞环'},{en:'piston land',zh:'活塞环槽岸'},{en:'piston skirt',zh:'活塞裙部'},{en:'pinhole',zh:'销座孔'},{en:'explosive force',zh:'爆破力、爆炸力'},{en:'groove',zh:'凹槽'},{en:'crankpin',zh:'曲柄销、曲柄针'},{en:'piston pin',zh:'活塞销'},{en:'thrust',zh:'推力'},{en:'rigid',zh:'坚硬的'}] },
  { id:'efi', icon:'⛽', name:'燃油系统',
    en:'UNIT-4 · Fuel System',
    desc:'发动机"喝"什么：24 个专业单词、燃油系统零件爆炸图、喷油器工作原理动画、3D 燃油系统模型、25 题闯关。',
    file:'courses/efi.js', html:'courses/efi.html',
    pages:['sec3-intro','sec3-vocab','sec3-parts','sec3-text','sec3-quiz','sec3-summary'],
    tabs:['导入','单词短语','零件动画','课文阅读','闯关练习','知识总结'],
    bank:[{en:'carburetor',zh:'化油器'},{en:'injection',zh:'喷射；注射'},{en:'supply',zh:'供给，补给'},{en:'combustible',zh:'易燃的'},{en:'injector',zh:'喷油器'},{en:'contaminant',zh:'污染物；致污物'},{en:'subsystem',zh:'子系统；次要系统'},{en:'sensor',zh:'传感器'},{en:'hose',zh:'软管'},{en:'preset',zh:'预先装置的；预先调整的'},{en:'energize',zh:'供给……能量'},{en:'spring',zh:'弹簧'},{en:'current',zh:'（水、气、电）流'},{en:'coil',zh:'卷；线圈'},{en:'solenoid',zh:'螺线管'},{en:'magnetic',zh:'有磁性的'},{en:'armature',zh:'（电机的）转子，电枢'},{en:'squirt',zh:'注射；喷射'},{en:'throttle',zh:'节流阀、节气门'},{en:'pedal',zh:'踏板'},{en:'depress',zh:'压低'},{en:'circuit',zh:'电路'},{en:'resistance',zh:'抵抗；电阻；阻力'},{en:'voltage',zh:'[电]电压'}] }
];
const REG={};
window.__COURSE_REGISTER=(id,mod)=>{ REG[id]=mod||{}; };
const progBar=$('#progressBar');
let curCourse=0, curPage=0;
const course=()=>COURSES[curCourse];
const trackEl=()=>$('#track-'+course().id);
const trackPages=()=>course().pages;
/* 加载课程（先注入页面 HTML，再加载模块 JS） */
function loadCourse(c){
  if(c._ready)return Promise.resolve(c);
  if(c._p)return c._p;
  c._p=new Promise((res,rej)=>{
    fetch(c.html).then(r=>{ if(!r.ok)throw new Error('html '+r.status); return r.text(); }).then(txt=>{
      let track=$('#track-'+c.id);
      if(!track){
        track=document.createElement('div');
        track.className='course-track'; track.id='track-'+c.id; track.style.display='none';
        const pages=$('#pages'); if(pages)pages.appendChild(track);
      }
      track.innerHTML=txt;
      const s=document.createElement('script');
      s.src=c.file;
      s.onload=()=>{ c._ready=true; res(c); };
      s.onerror=()=>rej(new Error('js'));
      document.head.appendChild(s);
    }).catch(rej);
  });
  return c._p;
}
function setLoading(on){
  let el=$('#courseLoading');
  if(!el){ el=document.createElement('div'); el.id='courseLoading'; el.className='course-loading'; const cv=$('#courseView'); if(cv)cv.appendChild(el); }
  if(el)el.style.display=on?'flex':'none';
}
function renderTabs(){
  const box=$('#tabInner'); if(!box)return;
  box.innerHTML='';
  trackPages().forEach((sec,i)=>{
    const a=document.createElement('a');
    a.href='#'+sec; a.dataset.sec=sec;
    a.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span>'+course().tabs[i];
    a.addEventListener('click',e=>{ e.preventDefault(); if(speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel(); goTo(i); });
    box.appendChild(a);
  });
}
function goTo(i,instant){
  const pages=trackPages();
  i=Math.max(0,Math.min(pages.length-1,i));
  curPage=i;
  const p=trackEl();
  if(p){
    if(instant)p.style.transition='none';
    p.style.transform='translateX('+(-curPage*100)+'vw)';
    if(instant){ requestAnimationFrame(()=>{ p.style.transition=''; }); }
  }
  progBar.style.width=(pages.length>1?(curPage/(pages.length-1)*100):0)+'%';
  $$('#tabInner a').forEach(a=>a.classList.toggle('active',a.dataset.sec===pages[curPage]));
  const pc=$('#pageCnt'); if(pc)pc.textContent=(curPage+1)+' / '+pages.length;
  const bp=$('#btnPrev'), bn=$('#btnNext'); if(bp)bp.disabled=curPage===0; if(bn)bn.disabled=curPage===pages.length-1;
  const ap=$('#arrowPrev'), an=$('#arrowNext'); if(ap)ap.disabled=curPage===0; if(an)an.disabled=curPage===pages.length-1;
  const dots=$('#pageDots'); if(dots){ dots.innerHTML=pages.map((_,k)=>'<i'+(k===curPage?' class="on"':'')+'></i>').join(''); }
  const pe=$('#'+pages[curPage]);
  if(pe){
    pe.scrollTop=0;
    const inner=pe.querySelector('.page-inner');
    if(inner){ inner.classList.remove('page-enter'); void inner.offsetWidth; inner.classList.add('page-enter'); }
  }
  if(pages[curPage]==='sec-four'&&window.__FOUR&&window.__FOUR.autoplay)window.__FOUR.autoplay();
  if(pages[curPage]==='sec2-parts'&&window.__PARTS&&window.__PARTS.auto)window.__PARTS.auto();
  try{
    const learned=JSON.parse(localStorage.getItem('dse-learned')||'{}');
    learned[pages[curPage]]=1;
    localStorage.setItem('dse-learned', JSON.stringify(learned));
    const n=Object.keys(learned).length;
    const total=COURSES.reduce((s,c)=>s+c.pages.length,0);
    const pt=$('#progressText'); if(pt)pt.textContent='已学 '+n+'/'+total+' 页';
  }catch(e){}
}
function showView(v){
  ['homeView','courseView','gameView'].forEach(id=>{ const e=$('#'+id); if(e)e.classList.remove('active'); });
  const map={home:'#homeView',course:'#courseView',game:'#gameView'};
  const t=$(map[v]); if(t)t.classList.add('active');
  const hb=$('#homeBack'); if(hb)hb.classList.toggle('show',v==='course');
  if(v!=='course'){ const pb=$('#pageNav'); if(pb)pb.style.display='none'; const sa=$$('.side-arrow'); sa.forEach(s=>s.style.display='none'); }
  else { const pb=$('#pageNav'); if(pb)pb.style.display='flex'; const sa=$$('.side-arrow'); sa.forEach(s=>s.style.display=''); }
  window.scrollTo(0,0);
}
function openCourse(idx){
  const c=COURSES[idx];
  if(!c)return;
  showView('course');
  setLoading(true);
  loadCourse(c).then(()=>{
    curCourse=idx; curPage=0;
    $$('.course-track').forEach(t=>{ t.style.display=(t.id==='track-'+c.id?'flex':'none'); });
    renderTabs();
    goTo(0,true);
    setLoading(false);
  }).catch(()=>{ setLoading(false); toast('⚠️ 课程加载失败，请检查网络后重试'); });
}
function openGame(){ showView('game'); if(window.__GAME&&window.__GAME.refreshLevels)window.__GAME.refreshLevels(); }
function openHome(){ showView('home'); }
function renderHome(){
  const g=$('#courseGrid'); if(!g)return;
  g.innerHTML='';
  COURSES.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='course-card';
    b.innerHTML='<div class="cnum">第 '+(i+1)+' 课</div><div class="ci">'+c.icon+'</div><div class="ct">'+c.name+'</div><div class="ce">'+c.en+'</div><div class="cd">'+c.desc+'</div><span class="cb">▶ 开始学习</span>';
    b.addEventListener('click',()=>openCourse(i));
    g.appendChild(b);
  });
  const n=$('#homeCourseNum'); if(n)n.textContent=COURSES.length;
}
$('#btnPrev')&&$('#btnPrev').addEventListener('click',()=>goTo(curPage-1));
$('#btnNext')&&$('#btnNext').addEventListener('click',()=>goTo(curPage+1));
$('#arrowPrev')&&$('#arrowPrev').addEventListener('click',()=>goTo(curPage-1));
$('#arrowNext')&&$('#arrowNext').addEventListener('click',()=>goTo(curPage+1));

$('#gameBack')&&$('#gameBack').addEventListener('click',openHome);

window.__PAGES={goTo,openCourse,openHome,openGame,loadCourse,get cur(){return curPage;},get course(){return curCourse;},get courses(){return COURSES;},get loaded(){return COURSES.map(c=>!!c._ready);}};

/* ================= 08 练习 ================= */
function createQuiz(cfg){
  const box=$(cfg.box), barEl=$(cfg.bar), QS=cfg.questions||[];
  if(!box)return null;
  let qi=0, score=0, answered=0, done=false;
  const STUDENTS=['左1','左2','左3','左4','左5','左6','左7','左8'];
  let picked=null, rolling=false;
  function pickStudent(){
    if(rolling)return;
    const nm=box.querySelector('#pickName'), btn=box.querySelector('#btnPick');
    if(!nm||!btn)return;
    rolling=true; btn.disabled=true; nm.classList.add('rolling');
    let ticks=0; const total=28;
    const iv=setInterval(()=>{
      nm.textContent=STUDENTS[(Math.random()*STUDENTS.length)|0];
      ticks++;
      if(ticks>=total){
        clearInterval(iv); rolling=false;
        picked=STUDENTS[(Math.random()*STUDENTS.length)|0];
        nm.textContent=picked; nm.classList.remove('rolling');
        btn.disabled=false; btn.textContent='🔄 重新抽人';
        const note=box.querySelector('.pick-note');
        if(note)note.innerHTML='当前被点名回答本题的是 <b>'+picked+'</b>，请作答；答完会显示他的表现。';
        toast('🎲 抽中 '+picked+' 回答本题！');
      }
    },55);
  }
  function render(){
    if(done){
      const ratio=score/QS.length;
      const emo=ratio===1?'🏆':ratio>=.8?'🎉':ratio>=.6?'👍':'📚';
      const msg=ratio===1?'满分！知识掌握得非常牢固！':ratio>=.8?'非常棒！知识点掌握得很好！':ratio>=.6?'不错，再看一遍动画会更牢固！':'别灰心，回到动画部分复习一下吧！';
      box.innerHTML='<div class="q-card q-result"><div class="emo">'+emo+'</div><div class="big">'+score+' / '+QS.length+' 分</div><div class="sub">'+msg+'</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="again">🔄 再挑战一次</button><button class="btn ghost" data-act="back">📖 回看动画复习</button></div></div>';
      box.querySelector('[data-act="again"]').addEventListener('click',()=>{qi=0;score=0;answered=0;done=false;if(barEl)barEl.style.width='0%';render();});
      box.querySelector('[data-act="back"]').addEventListener('click',()=>{ if(window.__PAGES){ const c=window.__PAGES.course; window.__PAGES.goTo(c===0?6:2); } });
      return;
    }
    const q=QS[qi], isTF=q.ty==='tf';
    const typeLabel=isTF?'判断题 TRUE / FALSE':'选择题 MULTIPLE CHOICE';
    const optsHtml=isTF
      ? '<div class="q-opt" data-v="1"><span class="k">✓</span>True</div><div class="q-opt" data-v="0"><span class="k">✗</span>False</div>'
      : q.opts.map((o,i)=>'<div class="q-opt" data-v="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span>'+o+'</div>').join('');
    box.innerHTML='<div class="pick-card"><span class="p-label">🎲 点名回答</span><div class="pick-stage"><span class="nm" id="pickName">'+(picked||'？')+'</span></div><button class="btn warn" id="btnPick" style="padding:9px 18px;font-size:13.5px">'+(picked?'🔄 重新抽人':'🎲 抽人回答')+'</button><div class="pick-note">'+(picked?'当前被点名回答本题的是 <b>'+picked+'</b>，请作答；答完会显示他的表现。':'点击"抽人回答"，随机抽取一名同学（左1~左8）来回答本题。')+'</div></div>'+
      '<div class="q-card"><span class="q-type '+(isTF?'tf':'')+'">'+typeLabel+' · 第 '+(qi+1)+' 题</span><div class="q-text">'+q.q+'<br><span class="en2">'+q.en+'</span></div><div class="q-opts">'+optsHtml+'</div><div class="q-feedback" id="qFb"></div><div class="q-nav"><span class="q-score">已答 <b id="qAn">'+answered+'</b>/'+QS.length+' · 得分 <b id="qSc">'+score+'</b></span><button class="btn" id="qNext" style="display:none">'+(qi===QS.length-1?'🏁 查看成绩':'下一题 →')+'</button></div></div>';
    box.querySelector('#btnPick').addEventListener('click',()=>pickStudent());
    const finish=(ok)=>{
      if(ok)score++; answered++;
      const fb=box.querySelector('#qFb'); fb.className='q-feedback show '+(ok?'ok':'no');
      fb.innerHTML='<b>🎤 '+(picked?picked+' ':'')+(ok?'回答正确！':'回答错误。')+'</b> 解析：'+q.exp;
      if(barEl)barEl.style.width=(answered/QS.length*100)+'%';
      box.querySelector('#qAn').textContent=answered; box.querySelector('#qSc').textContent=score;
      box.querySelector('#qNext').style.display='inline-flex';
    };
    box.querySelectorAll('.q-opt').forEach(opt=>opt.addEventListener('click',()=>{
      if(opt.classList.contains('locked'))return;
      const v=Number(opt.dataset.v), right=isTF?(q.a?1:0):q.a, ok=v===right;
      opt.classList.add(ok?'correct':'wrong');
      const ro=box.querySelector('.q-opt[data-v="'+right+'"]'); if(ro)ro.classList.add('correct');
      box.querySelectorAll('.q-opt').forEach(o=>o.classList.add('locked'));
      finish(ok);
    }));
    box.querySelector('#qNext').addEventListener('click',()=>{ qi++; if(qi>=QS.length)done=true; render(); });
  }
  render();
  return { get picked(){return picked;}, pick(){pickStudent();} };
}

/* ================= three.js 加载器（三课共用；各课的 3D 构建在其课程模块内） ================= */
const THREE_CDNS=[
  'https://cdn.staticfile.org/three.js/0.152.0/three.min.js',
  'https://cdn.bootcdn.net/ajax/libs/three.js/0.152.0/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js'
];
function loadThree(){
  return new Promise(res=>{
    if(window.THREE){ res(true); return; }
    let i=0;
    const tryNext=()=>{
      if(i>=THREE_CDNS.length){ res(false); return; }
      const s=document.createElement('script');
      s.src=THREE_CDNS[i++];
      s.onload=()=>res(!!window.THREE);
      s.onerror=tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}
/* ================= 单词大作战 2D 小游戏 ================= */
const GAME=(function(){
  const cv=$('#gameCanvas'), ctx=cv.getContext('2d');
  const W=640, H=360, ROWS=5, ROW_H=H/ROWS;
  const rowY=r=>r*ROW_H+ROW_H/2;
  /* 单词库：每个大关一个数组，后续更新单词往对应数组追加即可 */
  const WORD_BANK=COURSES.map(c=>c.bank||[]);
  const ROUND_SIZE=8;
  const CN_NUM=['一','二','三','四','五','六','七','八'];
  function buildLevels(){
    const lv=[];
    WORD_BANK.forEach((words,i)=>{
      if(!words.length)return;
      const rounds=[];
      for(let j=0;j<words.length;j+=ROUND_SIZE) rounds.push(words.slice(j,j+ROUND_SIZE));
      lv.push({name:(COURSES[i]?COURSES[i].name:'课程')+'（'+words.length+'词）', rounds});
    });
    return lv;
  }
  const LEVELS=buildLevels();
  const DIFF={easy:{speed:.35,spawn:2400,lives:3,label:'🟢 简单'},normal:{speed:.62,spawn:1700,lives:2,label:'🟡 一般'},hard:{speed:1.02,spawn:1000,lives:1,label:'🔴 困难'}};
  let diff='normal', level=0, round=0, queue=[], running=false, over=false, won=false;
  let score=0, combo=0;
  let zombies=[], bullets=[], people=[], spawnTimer=null, raf=null;
  function renderPlants(){
    const box=$('#gamePlants'); box.innerHTML='';
    if(zombies.length===0){ box.style.display='none'; return; }
    box.style.display='flex';
    const pool=LEVELS[level].rounds[round].map(w=>w.en);
    const set=new Set();
    zombies.forEach(z=>set.add(z.en));           /* 每只僵尸一个正确答案 */
    const total=Math.max(4, Math.min(zombies.length*4, pool.length));   /* 1只=4选项，2只=8选项 */
    while(set.size<total){ set.add(pool[(Math.random()*pool.length)|0]); }
    const arr=[...set].sort(()=>Math.random()-.5);
    arr.forEach(en=>{
      const b=document.createElement('button');
      b.className='plant-card'; b.textContent=en;
      b.addEventListener('click',()=>onPlantClick(en,b));
      box.appendChild(b);
    });
  }
  function onPlantClick(en,btn){
    if(!running||over||won)return;
    const idx=zombies.findIndex(z=>z.en===en);
    if(idx>=0){
      const z=zombies[idx];
      bullets.push({x:W/2,y:H-10,z});
      combo++; score+=10+Math.min(combo,10)*2;
      btn.style.background='#86efac';
    }else{
      combo=0; score-=20;
      zombies.forEach(z=>z.x-=90);
      btn.classList.add('bad');
      setTimeout(()=>{ if(btn&&btn.parentNode) btn.parentNode.removeChild(btn); },180);
      toast('❌ 种错了！扣 20 分，僵尸逼近！');
    }
  }
  function spawnZombie(w){
    if(!running||over||won)return;
    const z={en:w.en, zh:w.zh, x:W+30, y:16+Math.random()*(H-32), hit:false};
    const p=nearestPerson(z);
    z.d0=p?Math.hypot(p.x-z.x,p.y-z.y):W;   /* 记录出生时到人的距离，用于"走 2/3 刷下一只" */
    zombies.push(z);
    renderPlants();
  }
  function hitZombie(z){
    const i=zombies.indexOf(z); if(i<0)return;
    zombies.splice(i,1);
    renderPlants();
    maybeSpawn(); checkProgress();
  }
  function nearestPerson(z){
    let best=null, bd=1e9;
    people.forEach(p=>{ const d=Math.hypot(p.x-z.x,p.y-z.y); if(d<bd){ bd=d; best=p; } });
    return best;
  }
  function eatPerson(z,p){
    if(p) people=people.filter(x=>x!==p);
    const i=zombies.indexOf(z); if(i>=0) zombies.splice(i,1);
    combo=0;
    if(people.length<=0){ gameOver(); } else { renderPlants(); maybeSpawn(); checkProgress(); }
  }
  function winLevel(){
    won=true; running=false; clearInterval(spawnTimer);
    $('#gameWin').style.display='flex';
    const hasNext=level+1<LEVELS.length;
    $('#winText').textContent=LEVELS[level].name+'通关！得分 '+score;
    $('#btnGameNext').textContent=hasNext?'▶ 下一关':'🏆 全部通关，重新开始';
  }
  function gameOver(){
    over=true; running=false; clearInterval(spawnTimer);
    $('#gameOver').style.display='flex';
    $('#gameNote').textContent='💀 人都被吃光了… 难度：'+DIFF[diff].label+'。再试一次吧！';
  }
  function loadRound(){
    const lv=LEVELS[level];
    if(round>=lv.rounds.length){ winLevel(); return; }
    queue=lv.rounds[round].slice().sort(()=>Math.random()-.5);   /* 每轮单词各出现一次，仅打乱出场顺序 */
    $('#gameNote').textContent=lv.name+' · 第'+(round+1)+'/'+lv.rounds.length+' 轮 · 难度 '+DIFF[diff].label+' · 保护 '+DIFF[diff].lives+' 人';
  }
  const MAX_ZOMBIES=2;
  function maybeSpawn(){
    if(!running||over||won)return;
    if(queue.length===0)return;
    const n=zombies.length;
    if(n>=MAX_ZOMBIES)return;
    if(n===0){ spawnZombie(queue.shift()); return; }
    const z=zombies[0];
    const p=nearestPerson(z);
    if(p){ const d=Math.hypot(p.x-z.x,p.y-z.y); if(d<=z.d0/3){ spawnZombie(queue.shift()); } }
  }
  function checkProgress(){
    if(queue.length===0 && zombies.length===0){ round++; loadRound(); }
  }
  function startRound(){
    round=0; score=0; combo=0;
    zombies=[]; bullets=[];
    people=[];
    const lanes=[0,1,2,3,4].sort(()=>Math.random()-.5);
    for(let i=0;i<DIFF[diff].lives;i++){ people.push({x:28+Math.random()*80, y:rowY(lanes[i%lanes.length])}); }
    $('#gameOver').style.display='none'; $('#gameWin').style.display='none';
    running=true; over=false; won=false;
    loadRound();
    maybeSpawn();
  }
  function loop(){
    if(running&&!over&&!won){
      zombies.forEach(z=>{
        if(z.hit)return;
        const p=nearestPerson(z);
        if(p){
          const dx=p.x-z.x, dy=p.y-z.y, d=Math.hypot(dx,dy)||1;
          z.x+=dx/d*DIFF[diff].speed; z.y+=dy/d*DIFF[diff].speed;
          if(d<20){ z.hit=true; eatPerson(z,p); }
        }
      });
      maybeSpawn();
      const dead=[];
      bullets.forEach(b=>{
        if(b.z.hit){ dead.push(b); return; }
        const tx=b.z.x, ty=b.z.y;
        const dx=tx-b.x, dy=ty-b.y, d=Math.hypot(dx,dy)||1;
        b.x+=dx/d*9; b.y+=dy/d*9;
        if(Math.hypot(b.x-tx,b.y-ty)<14) dead.push(b);
      });
      dead.forEach(b=>{ if(!b.z.hit){ b.z.hit=true; hitZombie(b.z); } });
      bullets=bullets.filter(b=>!dead.includes(b));
      draw();
    }
    raf=requestAnimationFrame(loop);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let r=0;r<ROWS;r++){ ctx.fillStyle=r%2?'#8ed07a':'#9cdb89'; ctx.fillRect(0,r*ROW_H,W,ROW_H); }
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
    for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*ROW_H); ctx.lineTo(W,r*ROW_H); ctx.stroke(); }
    ctx.font='30px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    people.forEach(p=>{ ctx.fillText('🧍', p.x, p.y); });
    ctx.fillStyle='#14532d'; ctx.font='bold 16px system-ui'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('得分 '+score, 8, 8);
    if(combo>=2){ ctx.fillText('🔥 连击 x'+combo, 8, 30); }
    ctx.textAlign='right'; ctx.fillText(LEVELS[level].name+' · 第'+(round+1)+'轮 · 剩 '+(queue.length+zombies.length), W-8, 8);
    zombies.forEach(z=>{
      ctx.font='36px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🧟', z.x, z.y+4);
      ctx.font='bold 14px system-ui';
      const tw=ctx.measureText(z.zh).width;
      ctx.fillStyle='rgba(255,255,255,.92)';
      ctx.fillRect(z.x-tw/2-6, z.y-30, tw+12, 21);
      ctx.fillStyle='#111827'; ctx.fillText(z.zh, z.x, z.y-19);
    });
    ctx.fillStyle='#22c55e';
    bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill(); });
  }
  function renderLevels(){
    const g=$('#gameLevels'); if(!g)return;
    g.innerHTML='';
    LEVELS.forEach((lv,i)=>{
      const b=document.createElement('button');
      b.className='diff-btn'+(i===0?' on':'');
      b.textContent=lv.name;
      b.addEventListener('click',()=>{
        $$('#gameLevels .diff-btn').forEach(x=>x.classList.remove('on'));
        b.classList.add('on'); level=i;
        if(running){ $('#gameNote').textContent='已切换 '+lv.name+'（下一局生效）'; }
      });
      g.appendChild(b);
    });
    if(LEVELS.length<WORD_BANK.length){
      const b=document.createElement('button');
      b.className='diff-btn'; b.disabled=true; b.style.opacity=.5; b.textContent='关卡二（敬请期待）';
      g.appendChild(b);
    }
  }
  function bind(){
    renderLevels();
    $$('#gameDiff .diff-btn').forEach(b=>b.addEventListener('click',()=>{
      $$('#gameDiff .diff-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); diff=b.dataset.diff;
      if(running){ $('#gameNote').textContent='难度已切换为 '+DIFF[diff].label+'（下一局生效）'; }
    }));
    $('#btnGameStart').addEventListener('click',()=>{ level=0; startRound(); $('#btnGameStart').textContent='🔄 重新开始'; });
    $('#btnGameRetry').addEventListener('click',()=>{ startRound(); });
    $('#btnGameNext').addEventListener('click',()=>{
      if(level+1<LEVELS.length){ level++; startRound(); }
      else{ level=0; startRound(); }
    });
  }
  (function init(){
    ctx.fillStyle='#7cc96b'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='bold 22px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🎮 点击上方「开始游戏」', W/2, H/2-12);
    ctx.font='15px system-ui'; ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.fillText('保护左侧的人，别让僵尸吃掉他们！', W/2, H/2+20);
    ctx.textAlign='left'; ctx.textBaseline='top';
  })();
  raf=requestAnimationFrame(loop);
  bind();
  window.__GAME={ get running(){return running;}, get lives(){return people.length;}, get score(){return score;}, get level(){return level;}, get diff(){return diff;}, get round(){return round;}, get rounds(){return LEVELS[level]?LEVELS[level].rounds.length:0;}, get remaining(){return queue.length+zombies.length;}, get zcount(){return zombies.length;}, refreshLevels(){ renderLevels(); } };
  return {};
})();
